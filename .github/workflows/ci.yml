# TRACESETTLE continuous integration.
#
# Runs the full check set on every pull request and every push to master:
# the test suite, static analysis, byte-compilation, a Docker build + runtime
# smoke test (non-root, health endpoint), and the offline demo determinism check.
#
# Security posture of this workflow:
#   * top-level `permissions` grants the read-only minimum (contents: read) and
#     each job inherits it; no job is given write access;
#   * third-party actions are pinned to immutable commit SHAs, not moving tags;
#   * it performs no deployment, no publish, and no release.
#
# It needs no repository secrets: the offline demo and the test suite run without
# network access to upstream services.

name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege: read the repository, nothing else. No job writes.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test suite
        run: python -m pytest tests/ -q

      - name: Static analysis (pyflakes)
        run: python -m pyflakes tracesettle/ tests/ demo/

      - name: Byte-compile every module
        run: python -m compileall -q tracesettle/ tests/ demo/

      - name: Offline demo determinism
        run: |
          set -eu
          python demo/demonstrate.py --offline > /tmp/demo-1.txt
          python demo/demonstrate.py --offline > /tmp/demo-2.txt
          if ! cmp -s /tmp/demo-1.txt /tmp/demo-2.txt; then
            echo "offline demo output is not deterministic"
            diff -u /tmp/demo-1.txt /tmp/demo-2.txt || true
            exit 1
          fi
          echo "offline demo is byte-identical across runs"

      - name: NEAR attack demonstration determinism
        run: |
          set -eu
          python demo/near_demo.py --json > /tmp/near-1.json
          python demo/near_demo.py --json > /tmp/near-2.json
          if ! cmp -s /tmp/near-1.json /tmp/near-2.json; then
            echo "NEAR demonstration output is not deterministic"
            diff -u /tmp/near-1.json /tmp/near-2.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/near-1.json") as handle:
              data = json.load(handle)
          if not data["all_passed"]:
              raise SystemExit("a NEAR attack scenario did not match its expected outcome")
          print(f'{len(data["results"])} NEAR attack scenarios matched expectation')
          PY

      - name: Agent lifecycle demonstration (offline) determinism
        run: |
          set -eu
          python demo/near_agent_demo.py --json > /tmp/agent-1.json
          python demo/near_agent_demo.py --json > /tmp/agent-2.json
          if ! cmp -s /tmp/agent-1.json /tmp/agent-2.json; then
            echo "agent lifecycle demonstration output is not deterministic"
            diff -u /tmp/agent-1.json /tmp/agent-2.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/agent-1.json") as handle:
              data = json.load(handle)
          mal = data["malicious"]
          legit = data["legitimate"]
          assert mal["decision"] == "BLOCK", mal["decision"]
          assert mal["signer_calls"] == 0, "the signer was reached for a blocked payment"
          assert mal["broadcast_occurred"] is False
          assert legit["decision"] == "ALLOW", legit["decision"]
          assert legit["signer_calls"] == 1
          assert legit["settlement_state"] == "VERIFIED", legit["settlement_state"]
          # The authorization must be bound to the exact bytes that are signed:
          # the bound transaction_digest equals the recomputed signed-bytes digest.
          binding = legit["authorization_binding"]
          assert binding["destination"] == legit["proposed_receiver"], binding
          assert binding["transaction_digest"] == legit["signed_bytes_digest"], (
              "the authorization is not bound to the exact signed bytes"
          )
          assert legit["signed_bytes_digest"].startswith("sha256:")
          print("agent lifecycle demonstration reproduced: block-before-sign + verified settlement")
          PY

      - name: Recovery verification demonstration determinism
        run: |
          set -eu
          python demo/near_recovery_demo.py --json > /tmp/recovery-1.json
          python demo/near_recovery_demo.py --json > /tmp/recovery-2.json
          if ! cmp -s /tmp/recovery-1.json /tmp/recovery-2.json; then
            echo "recovery demonstration output is not deterministic"
            diff -u /tmp/recovery-1.json /tmp/recovery-2.json || true
            exit 1
          fi
          python - <<'PY'
          import json
          with open("/tmp/recovery-1.json") as handle:
              data = json.load(handle)
          if not data["all_passed"]:
              raise SystemExit("a recovery-verification check did not match its expected outcome")
          passed = [c for c in data["checks"] if c["passed"]]
          print(f'{len(passed)}/{len(data["checks"])} recovery checks reproduced')
          PY

      - name: Independent evaluation scenarios (judge path)
        run: |
          set -eu
          # The offline judge path is the one an independent evaluator runs. It
          # must be deterministic, and every enforcement scenario must behave as
          # specified. The live settlement check may report UNAVAILABLE on a
          # runner with no network (and could vary between runs if the network is
          # flaky), so determinism is required only of the enforcement half.
          python -m tracesettle judge --json > /tmp/judge-1.json
          python -m tracesettle judge --json > /tmp/judge-2.json
          python - <<'PY'
          import json

          def enforcement(path):
              with open(path) as handle:
                  report = json.load(handle)
              summary = report["summary"]
              assert summary["enforcement_passed"] == summary["enforcement_total"], summary
              assert summary["broadcast_occurred"] is False, summary
              sims = [s for s in report["scenarios"] if not s["real"]]
              for scenario in sims:
                  assert scenario["passed"], scenario
              return summary["enforcement_passed"], sims

          count_1, sims_1 = enforcement("/tmp/judge-1.json")
          count_2, sims_2 = enforcement("/tmp/judge-2.json")
          if sims_1 != sims_2:
              print("enforcement scenario results are not deterministic")
              raise SystemExit(1)
          print(f"{count_1} enforcement scenarios matched expectation, deterministically")
          PY

      - name: Confirm no runtime third-party imports
        run: |
          set -eu
          python - <<'PY'
          import ast
          import pathlib
          import sys

          # The runtime is standard-library only. A non-stdlib import at module
          # level fails the build. A small allowlist of *optional* extras may be
          # imported lazily inside a function body (so the default path never
          # needs them); today that is only the PostgreSQL driver behind the
          # opt-in shared-state backend.
          stdlib = set(sys.stdlib_module_names)
          optional_extras = {"psycopg"}
          offenders = []

          def check(path, node, inside_function):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  inside_function = True
              if isinstance(node, ast.Import):
                  names = [a.name.split(".")[0] for a in node.names]
              elif isinstance(node, ast.ImportFrom):
                  names = [node.module.split(".")[0]] if node.module and node.level == 0 else []
              else:
                  names = []
              for name in names:
                  if not name or name == "tracesettle" or name in stdlib:
                      continue
                  if inside_function and name in optional_extras:
                      continue
                  where = " (module level)" if not inside_function else " (not an allowed extra)"
                  offenders.append(f"{path}: {name}{where}")
              for child in ast.iter_child_nodes(node):
                  check(path, child, inside_function)

          for path in pathlib.Path("tracesettle").rglob("*.py"):
              tree = ast.parse(path.read_text(), filename=str(path))
              check(path, tree, False)
          if offenders:
              print("disallowed runtime imports found:")
              print("\n".join(offenders))
              raise SystemExit(1)
          print("runtime imports are standard-library only (optional extras are lazy)")
          PY

  postgres:
    name: PostgreSQL shared-state integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real PostgreSQL server, so the distributed guarantees are exercised for
    # real: cross-instance replay refusal, the shared spend window, revocation,
    # idempotency, migrations, and fail-closed behaviour on an outage.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracesettle
          POSTGRES_PASSWORD: tracesettle
          POSTGRES_DB: tracesettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracesettle"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TRACESETTLE_TEST_PG_DSN: "postgresql://tracesettle:tracesettle@127.0.0.1:5432/tracesettle_test"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Wait for PostgreSQL
        run: |
          set -eu
          for i in $(seq 1 30); do
            if python -c "
          import psycopg, os
          psycopg.connect(os.environ['TRACESETTLE_TEST_PG_DSN']).close()
          " 2>/dev/null; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready"
          exit 1

      - name: Shared-state integration tests (real PostgreSQL)
        run: |
          set -eu
          # A DSN that is set but cannot be reached would let the module-level
          # skipif turn every test into a skip, and a green run would then prove
          # nothing. Require every PostgreSQL test to actually execute.
          python -m pytest tests/test_guard_postgres.py -q --junitxml=/tmp/pg-guard.xml
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/pg-guard.xml").getroot()
          suite = root.find("testsuite") if root.tag != "testsuite" else root
          tests = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          failures = int(suite.get("failures", "0")) + int(suite.get("errors", "0"))
          if tests == 0 or failures:
              sys.exit(f"PostgreSQL suite did not run cleanly: tests={tests} failures={failures}")
          if skipped:
              sys.exit(f"{skipped} PostgreSQL test(s) skipped although a DSN was configured")
          print(f"{tests} PostgreSQL tests executed against a real server, 0 skipped")
          PY

      - name: Full suite with the PostgreSQL backend available
        run: python -m pytest tests/ -q

  docker:
    name: Docker build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build the image
        run: docker build -t tracesettle:ci .

      - name: Container runs non-root and answers the health check
        run: |
          set -eu
          # The image binds 0.0.0.0, so fail-closed startup requires both
          # credentials. These are throwaway CI values, never real secrets.
          GUARD_KEY=$(python -c "import secrets;print(secrets.token_hex(32))")
          docker run -d --name tracesettle-ci -p 8000:8000 \
            -e TRACESETTLE_API_KEY=ci-throwaway-key \
            -e TRACESETTLE_GUARD_AUTH_KEY="$GUARD_KEY" \
            tracesettle:ci
          # The image has a HEALTHCHECK; wait for it to report healthy.
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tracesettle-ci || echo unknown)
            if [ "$state" = "healthy" ]; then break; fi
            sleep 1
          done
          state=$(docker inspect --format '{{.State.Health.Status}}' tracesettle-ci)
          uid=$(docker exec tracesettle-ci id -u)
          echo "health=$state uid=$uid"
          docker logs tracesettle-ci
          test "$state" = "healthy"
          test "$uid" = "10001"

      - name: Container refuses to start without credentials
        run: |
          set -eu
          # Fail-closed proof: the same image with no credentials on its default
          # public bind must exit rather than serve.
          docker run --name tracesettle-ci-nocreds tracesettle:ci > /tmp/nocreds.log 2>&1 || true
          code=$(docker inspect --format '{{.State.ExitCode}}' tracesettle-ci-nocreds)
          echo "exit=$code"
          cat /tmp/nocreds.log
          test "$code" = "2"
          grep -q "refusing to start" /tmp/nocreds.log
          docker rm -f tracesettle-ci-nocreds >/dev/null

      - name: Graceful shutdown
        run: |
          set -eu
          start=$(date +%s)
          docker stop -t 10 tracesettle-ci
          code=$(docker inspect --format '{{.State.ExitCode}}' tracesettle-ci)
          elapsed=$(( $(date +%s) - start ))
          echo "exit=$code elapsed=${elapsed}s"
          test "$code" = "0"
          test "$elapsed" -lt 10

      - name: Clean up
        if: always()
        run: docker rm -f tracesettle-ci || true

  vercel-container:
    name: Vercel container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: vercel.json is valid and pins Dockerfile.vercel
        run: |
          set -eu
          python - <<'PY'
          import json

          with open("vercel.json") as fh:
              config = json.load(fh)
          service = config["services"]["tracesettle"]
          # The whole point of the file: the image is built from Dockerfile.vercel,
          # never the generic root Dockerfile (which lacks the PostgreSQL driver).
          assert service["root"] == "."
          assert service["runtime"] == "container"
          assert service["entrypoint"] == "Dockerfile.vercel"
          assert config["rewrites"] == [
              {"source": "/(.*)", "destination": {"service": "tracesettle"}}
          ]
          print("vercel.json pins Dockerfile.vercel and routes all traffic to it")
          PY

      - name: Build the Vercel image
        run: docker build -f Dockerfile.vercel -t tracesettle:vercel .

      - name: Image carries the driver, runs non-root, exposes port 80
        run: |
          set -eu
          # The Vercel build passes no Docker build arguments, so the PostgreSQL
          # driver must be baked in. Assert it, plus the non-root user and port.
          user=$(docker inspect --format '{{.Config.User}}' tracesettle:vercel)
          ports=$(docker inspect --format '{{json .Config.ExposedPorts}}' tracesettle:vercel)
          driver=$(docker run --rm --entrypoint python tracesettle:vercel -c \
            "import psycopg; print(psycopg.__version__)")
          echo "user=$user ports=$ports psycopg=$driver"
          test "$user" = "tracesettle"
          echo "$ports" | grep -q '"80/tcp"'
          test -n "$driver"

      - name: Container serves on port 80 and answers the health check
        run: |
          set -eu
          # Throwaway CI credentials, never real secrets. The image binds
          # 0.0.0.0, so fail-closed startup requires both.
          GUARD_KEY=$(python -c "import secrets;print(secrets.token_hex(32))")
          docker run -d --name tracesettle-vercel -p 8000:80 \
            -e TRACESETTLE_API_KEY=ci-throwaway-key \
            -e TRACESETTLE_GUARD_AUTH_KEY="$GUARD_KEY" \
            tracesettle:vercel
          for i in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Health.Status}}' tracesettle-vercel || echo unknown)
            if [ "$state" = "healthy" ]; then break; fi
            sleep 1
          done
          state=$(docker inspect --format '{{.State.Health.Status}}' tracesettle-vercel)
          echo "health=$state"
          docker logs tracesettle-vercel
          # The default bind is port 80, the port Vercel routes to.
          docker logs tracesettle-vercel 2>&1 | grep -q "serving on http://0.0.0.0:80"
          test "$state" = "healthy"
          # The published port answers.
          code=$(docker exec tracesettle-vercel python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:80/api/health', timeout=5).status)")
          test "$code" = "200"

      - name: Unauthenticated guard call is rejected
        run: |
          set -eu
          code=$(docker exec tracesettle-vercel python -c "
          import urllib.error, urllib.request
          try:
              urllib.request.urlopen('http://127.0.0.1:80/api/investigate', data=b'{}', timeout=5)
              print(200)
          except urllib.error.HTTPError as exc:
              print(exc.code)
          ")
          echo "unauthenticated /api/investigate -> $code"
          test "$code" = "401"

      - name: Clean up
        if: always()
        run: docker rm -f tracesettle-vercel || true
